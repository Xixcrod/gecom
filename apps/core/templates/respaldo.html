{% extends 'layouts/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/respaldo.css' %}" />
{% endblock extra_css %}

{% block titulo_seccion %}Respaldo{% endblock %}

{% block content %}
<div class="card p-4 my-4">
    <h3>Centro de Respaldo</h3>

    <div class="d-flex-custom">
        <button type="button" class="btn-custom btn-primary-custom trigger-modal" 
                data-url="{% url 'hacer_respaldo' %}" 
                data-message="¿Crear y subir respaldo a Drive? Esto tardará unos segundos.">
            Respaldar Sistema a la Nube
        </button>

        <button type="button" class="btn-custom btn-danger-custom trigger-modal" 
                data-url="{% url 'hacer_restauracion' %}" 
                data-message="¡ADVERTENCIA! Esto borrará la base de datos actual y pondrá la app en mantenimiento. ¿Continuar?">
            Restaurar desde la Nube
        </button>
    </div>
</div>

<!-- Modal de Confirmación -->
<dialog id="customModal" class="custom-modal">
    <div class="modal-content">
        <h3 id="modalTitle">Confirmar Acción</h3>
        <p id="modalMessage"></p>
        <div class="modal-actions">
            <button id="cancelBtn" class="btn-custom btn-secondary">Cancelar</button>
            <a id="confirmBtn" href="#" class="btn-custom">Confirmar y Continuar</a>
        </div>
    </div>
</dialog>
<script src="{% static 'js/modal_confirmacion.js' %}"></script>
{% endblock content %}
