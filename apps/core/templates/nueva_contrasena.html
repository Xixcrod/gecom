{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/favicon.png' %}">
    <title>GECOM - Restablecer Contraseña</title>
    <link rel="stylesheet" href="{% static 'css/_variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/landing_page.css' %}">
</head>

<body>
    <div class="login-card" style="max-width: 450px;">
        
        <div class="logos-container">
            </div>

        <h2 class="login-title" style="font-size: 1.5rem; margin-bottom: 0.5rem;">Restablecer Contraseña</h2>
        <p style="color: #334155; font-size: 0.95rem; margin-bottom: 1.5rem; font-weight: 600;">
            Ingresa tu nueva contraseña para acceder al sistema GECOM.
        </p>

        {% if error %}
        <div class="alert-msg alert-error">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; flex-shrink: 0;">
                <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="login-form">
            {% csrf_token %}

            <div class="input-group">
                <input type="password" name="password" class="login-input" placeholder="Nueva Contraseña" required minlength="8">
            </div>
            
            <div class="input-group">
                <input type="password" name="confirm_password" class="login-input" placeholder="Confirmar Contraseña" required minlength="8">
            </div>
            
            <button type="submit" class="btn-login">Actualizar Contraseña</button>
            
            <div class="forgot-container" style="margin-top: 10px;">
                <a href="{% url 'login' %}" class="forgot-link" style="display: flex; align-items: center; justify-content: center; gap: 5px;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Cancelar y volver al inicio
                </a>
            </div>
        </form>
    </div>
</body>
</html>
