{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}"> -->
    <title>GECOM</title>
    <link rel="stylesheet" href="{% static 'css/_variables.css' %}">
    <!-- <link rel="stylesheet" href="{% static 'css/nueva_contrasena.css' %}"> -->
    <!-- <link rel="stylesheet" href="{% static 'css/fonts.css' %}"> -->
</head>

<body>
    <div>
        <h2>Recuperar Contraseña</h2>

        <form action="{% url 'processing_new_password' %}" method="POST">
            {% csrf_token %}

            <input type="password" name="password" id="password" placeholder="Contraseña" required />

            <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirmar Contraseña" required />

            <button type="submit">Generar Nueva Contraseña</button>

            <a href="{% url 'login' %}" class="back-link">Volver al inicio de sesión</a>
        </form>
    </div>
</body>
