{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}"> -->
    <title>GECOM</title>
    <link rel="stylesheet" href="{% static 'css/_variables.css' %}">
    <!-- <link rel="stylesheet" href="{% static 'css/recuperar_contrasena.css' %}"> -->
    <!-- <link rel="stylesheet" href="{% static 'css/fonts.css' %}"> -->
</head>

<body>
    <div>
        <h2>Recuperar Contraseña</h2>

        {% if error %}
            <div>{{ error }}</div>
        {% endif %}

        <form action="{% url 'processing_password' %}" method="POST">
            {% csrf_token %}

            <label for="username">Cédula</label>
            <input type="text" id="username" name="username" placeholder="Ingrese su cédula" required />

            <label for="email">Correo</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required />

            <button type="submit">Enviar Solicitud</button>

            <a href="{% url 'login' %}" class="back-link">Volver al inicio de sesión</a>
        </form>
    </div>
</body>
</html>
